[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java-doc-assistant"
version = "0.1.0"
description = "دستیار پرسش‌وپاسخ و مستندسازی فقط-خواندنی برای کدبیس‌های جاوا (Spring Boot / Spring Batch) با RAG لوکال"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "tree-sitter>=0.22",
    "tree-sitter-java>=0.23",
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4.2",
]

[project.scripts]
casprag = "java_doc_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
